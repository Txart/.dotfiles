[opener]
edit = [{ run = "nvim $@", block = true, desc = "Edit in Neovim" }]
audio = [{ run = 'mpv --force-window=yes "$@"', block = false }]
tiff = [{ run = 'feh "$@"', block = false, desc = "View with feh" }]

[open]
prepend_rules = [
  { url = "*.html", use = [
    "open",
    "edit",
  ] },
  { url = "*.tiff", use = [
    "tiff",
  ] },
]
